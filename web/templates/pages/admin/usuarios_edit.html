{{define "pages/admin/usuarios_edit.html"}}
<div class="flex items-center justify-between mb-4">
    <h1 class="text-xl font-bold text-slate-800">Editar Usuario {{index .Usuario "username"}}</h1>
</div>

<div class="bg-white rounded-xl shadow-sm p-4" style="max-width: 32rem;">
    <form method="post" action="/admin/usuarios/{{index .Usuario "id"}}/editar" class="space-y-4">
        <div>
            <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
            <input type="text" id="username" name="username" value="{{index .Usuario "username"}}" required
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
            <input type="password" id="password" name="password" placeholder="Dejar vacío para no cambiar"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div>
            <label for="rol" class="block text-sm font-medium text-slate-700 mb-1">Rol</label>
            <select id="rol" name="rol"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                <option value="user" {{if eq (index .Usuario "rol") "user"}}selected{{end}}>user</option>
                <option value="admin" {{if eq (index .Usuario "rol") "admin"}}selected{{end}}>admin</option>
            </select>
        </div>

        <div>
            <label for="entidad_id" class="block text-sm font-medium text-slate-700 mb-1">Entidad</label>
            <select id="entidad_id" name="entidad_id"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                <option value="">Sin entidad</option>
                {{range .Entidades}}
                <option value="{{index . "id"}}"
                    {{if eq (printf "%v" (index $.Usuario "entidad_id")) (printf "%v" (index . "id"))}}selected{{end}}>
                    {{index . "nombre"}}
                </option>
                {{end}}
            </select>
        </div>

        <div class="flex items-center gap-2">
            <input type="checkbox" id="activo" name="activo"
                   {{if index .Usuario "activo"}}checked{{end}}
                   class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
            <label for="activo" class="text-sm font-medium text-slate-700">Activo</label>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Tiendas</label>
            <div class="grid grid-cols-2 gap-2">
                {{range .Tiendas}}
                {{$uid := index . "uid"}}
                <label class="flex items-center gap-2 text-sm text-slate-700">
                    <input type="checkbox" name="tiendas" value="{{$uid}}"
                           {{range $.TiendasAsignadas}}{{if eq . $uid}}checked{{end}}{{end}}
                           class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                    {{$uid}} - {{index . "nombre"}}
                </label>
                {{end}}
            </div>
        </div>

        <div class="flex items-center gap-3 pt-2">
            <a href="/admin/usuarios"
               class="inline-flex items-center bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium px-4 py-2 rounded-lg transition-colors">Cancelar</a>
            <button type="submit"
                    class="inline-flex items-center bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">Guardar</button>
        </div>
    </form>
</div>
{{end}}
