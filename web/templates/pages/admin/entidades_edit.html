{{define "pages/admin/entidades_edit.html"}}
<div class="flex items-center justify-between mb-4">
    <h1 class="text-xl font-bold text-slate-800">Editar Entidad {{index .Entidad "nombre"}}</h1>
</div>

<div class="bg-white rounded-xl shadow-sm p-4" style="max-width: 32rem;">
    <form method="post" action="/admin/entidades/{{index .Entidad "id"}}/editar" class="space-y-4">
        <div>
            <label for="nombre" class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
            <input type="text" id="nombre" name="nombre" value="{{index .Entidad "nombre"}}" required
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div>
            <label for="llave" class="block text-sm font-medium text-slate-700 mb-1">Llave</label>
            <input type="text" id="llave" name="llave" value="{{index .Entidad "llave"}}" required
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div>
            <label for="admin_id" class="block text-sm font-medium text-slate-700 mb-1">Admin</label>
            <select id="admin_id" name="admin_id"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                <option value="">Sin admin</option>
                {{range .Usuarios}}
                <option value="{{index . "id"}}"
                    {{if eq (printf "%v" (index $.Entidad "admin_id")) (printf "%v" (index . "id"))}}selected{{end}}>
                    {{index . "username"}}
                </option>
                {{end}}
            </select>
        </div>

        <div class="flex items-center gap-2">
            <input type="checkbox" id="activo" name="activo"
                   {{if index .Entidad "activo"}}checked{{end}}
                   class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
            <label for="activo" class="text-sm font-medium text-slate-700">Activa</label>
        </div>

        <div class="flex items-center gap-3 pt-2">
            <a href="/admin/entidades"
               class="inline-flex items-center bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium px-4 py-2 rounded-lg transition-colors">Cancelar</a>
            <button type="submit"
                    class="inline-flex items-center bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">Guardar</button>
        </div>
    </form>
</div>
{{end}}
