{{define "layouts/admin.html"}}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} - Admin Pagos</title>
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/tailwind.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif}h1,h2,h3,h4,h5{font-family:'Space Grotesk',sans-serif}</style>
</head>
<body class="bg-slate-50">
  <div class="flex min-h-screen">
    <aside class="w-60 bg-slate-900 text-white fixed h-full overflow-y-auto">
      {{template "partials/sidebar.html" .}}
    </aside>
    <main class="ml-60 flex-1 p-6" id="content">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-xl font-bold text-slate-900">{{.Title}}</h1>
        <div class="flex items-center gap-3 text-sm text-slate-500">
          <span>{{.Admin.Username}}</span>
          <a href="/logout" class="text-rose-500 hover:text-rose-600 font-medium">Cerrar sesión</a>
        </div>
      </div>
      {{.PageContent}}
    </main>
  </div>
</body>
</html>
{{end}}
