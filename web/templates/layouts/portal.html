{{define "layouts/portal.html"}}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} - Portal Cliente</title>
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/tailwind.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif}h1,h2,h3,h4,h5{font-family:'Space Grotesk',sans-serif}</style>
</head>
<body class="bg-slate-50">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="/portal/" class="text-lg font-bold text-slate-900">Portal Cliente</a>
      <div class="flex items-center gap-4 text-sm text-slate-600">
        <span class="font-medium text-slate-800">{{.Cliente.ClienteNombre}}</span>
        <nav class="flex items-center gap-4">
          <a href="/portal/pagos" class="hover:text-indigo-600">Pagos</a>
          <a href="/portal/devoluciones" class="hover:text-indigo-600">Devoluciones</a>
        </nav>
        <form method="POST" action="/portal/logout">
          <button type="submit" class="text-rose-500 hover:text-rose-600 font-medium">Cerrar sesión</button>
        </form>
      </div>
    </div>
  </header>
  <main class="max-w-6xl mx-auto p-6">
    {{.PageContent}}
  </main>
</body>
</html>
{{end}}
